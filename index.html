<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040c">
<meta name="description" content="極光下的漂浮聖誕樹 — Three.js 單檔互動 3D 場景">
<title>極光下的漂浮聖誕樹</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050a18'/%3E%3Cpath d='M16 5l6 9h-3l5 8h-5l4 6H9l4-6H8l5-8h-3z' fill='%237ff0c8'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #02040c;
    color: #e8ecff;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  #scene {
    position: fixed; inset: 0;
    display: block; width: 100%; height: 100%;
    touch-action: none;
  }

  /* ---------- loading ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px;
    background: radial-gradient(120% 90% at 50% 0%, #0b1a3a 0%, #050a1a 45%, #010206 100%);
    transition: opacity 1.1s ease, visibility 1.1s ease;
  }
  #loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loader-tree {
    width: 74px; height: 96px;
    position: relative;
    filter: drop-shadow(0 0 14px rgba(120, 230, 200, .45));
  }
  .loader-tree span {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 30px solid rgba(196, 255, 232, .9);
  }
  .loader-tree span:nth-child(1) { top: 0;  border-left-width: 14px; border-right-width: 14px; border-bottom-width: 26px; opacity: .55; }
  .loader-tree span:nth-child(2) { top: 22px; border-left-width: 19px; border-right-width: 19px; border-bottom-width: 30px; opacity: .8; }
  .loader-tree span:nth-child(3) { top: 50px; }
  .loader-tree::after {
    content: ""; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 4px; height: 12px; background: rgba(255, 220, 160, .55); border-radius: 2px;
  }
  .loader-label {
    font-size: 13px; letter-spacing: .32em; text-indent: .32em;
    color: rgba(214, 232, 255, .78); font-weight: 400;
  }
  .loader-bar {
    width: 168px; height: 2px; border-radius: 2px; overflow: hidden;
    background: rgba(140, 180, 255, .14);
  }
  .loader-bar i {
    display: block; width: 40%; height: 100%;
    background: linear-gradient(90deg, rgba(90,255,190,0), #7ff0c8, #b79bff, rgba(183,155,255,0));
    animation: sweep 1.6s cubic-bezier(.45,.05,.55,.95) infinite;
  }
  @keyframes sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
  #loader .err {
    display: none; max-width: 30em; text-align: center; line-height: 1.7;
    font-size: 13px; color: rgba(255, 190, 190, .9);
  }
  #loader.is-error .loader-bar, #loader.is-error .loader-tree { display: none; }
  #loader.is-error .err { display: block; }

  /* ---------- hud ---------- */
  #hud {
    position: fixed; inset: 0; z-index: 5;
    pointer-events: none;
    opacity: 0; transition: opacity 2s ease 0.3s;
  }
  #hud.is-visible { opacity: 1; }
  /* a soft vignette keeps the eye on the tree */
  #hud::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 95% at 50% 42%, rgba(0,0,0,0) 42%, rgba(0,0,0,.38) 100%);
  }
  #title {
    position: absolute; left: max(24px, env(safe-area-inset-left)); bottom: max(26px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 6px;
  }
  #title h1 {
    margin: 0; font-size: clamp(17px, 2.4vw, 23px); font-weight: 500;
    letter-spacing: .2em; color: #f2f5ff;
  }
  #title, #hint { text-shadow: 0 1px 12px rgba(0, 0, 0, .7), 0 0 24px rgba(130, 200, 255, .18); }
  #title p {
    margin: 0; font-size: 11.5px; letter-spacing: .16em;
    color: rgba(196, 214, 255, .55);
  }
  #hint {
    position: absolute; right: max(24px, env(safe-area-inset-right)); bottom: max(28px, env(safe-area-inset-bottom));
    font-size: 11px; letter-spacing: .14em; color: rgba(196, 214, 255, .42);
    text-align: right; line-height: 1.9;
  }
  @media (max-width: 640px) {
    #hint { display: none; }
    #title { left: 18px; bottom: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .loader-bar i { animation-duration: 3.2s; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div id="title">
    <h1>極光下的漂浮聖誕樹</h1>
    <p>AURORA · CHRISTMAS</p>
  </div>
  <div id="hint">
    拖曳旋轉 · 滾輪縮放<br>
    點擊樹上的飾球
  </div>
</div>

<div id="loader" role="status" aria-live="polite">
  <div class="loader-tree"><span></span><span></span><span></span></div>
  <div class="loader-label">正在點亮極光</div>
  <div class="loader-bar"><i></i></div>
  <div class="err">場景載入失敗。<br>本頁需要連線網路載入 Three.js CDN，請確認網路後重新整理。</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script>
  // CDN / module loading guard: if the ES module never boots, reveal a message instead of a frozen loader.
  window.__auroraBooted = false;
  setTimeout(function () {
    if (window.__auroraBooted) return;
    var el = document.getElementById('loader');
    if (el && !el.classList.contains('is-hidden')) el.classList.add('is-error');
  }, 18000);
  window.addEventListener('error', function () {
    if (window.__auroraBooted) return;
    var el = document.getElementById('loader');
    if (el) el.classList.add('is-error');
  }, true);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

window.__auroraBooted = true;

/* =========================================================================
   Config
   ========================================================================= */
const isMobile = window.matchMedia('(max-width: 820px), (pointer: coarse)').matches;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const DPR_CAP = isMobile ? 1.5 : 2;

const P = {
  stars: isMobile ? 1100 : 2600,
  snow: isMobile ? 1400 : 4200,
  motes: isMobile ? 220 : 520,
  needles: isMobile ? 3200 : 7000,
  bulbLights: isMobile ? 5 : 7,
  bloom: isMobile ? 0.55 : 0.75,
  treeY: 2.4,
};

const BG_COLOR = new THREE.Color('#02040c');
const FOG_DENSITY = 0.0105;

/* =========================================================================
   Seeded random (stable layout across reloads)
   ========================================================================= */
let seed = 20251225;
function rand() {
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length) % arr.length];

/* =========================================================================
   Renderer / scene / camera
   ========================================================================= */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR_CAP));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = BG_COLOR.clone();
scene.fog = new THREE.FogExp2(BG_COLOR.clone(), FOG_DENSITY);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 1200);
camera.position.set(0, 6.0, 30);

/* =========================================================================
   Shared GLSL
   ========================================================================= */
const NOISE_GLSL = /* glsl */`
  vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec4 mod289(vec4 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec4 permute(vec4 x){ return mod289(((x * 34.0) + 10.0) * x); }
  vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
  float snoise(vec3 v){
    const vec2 C = vec2(1.0/6.0, 1.0/3.0);
    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
    vec3 i  = floor(v + dot(v, C.yyy));
    vec3 x0 = v - i + dot(i, C.xxx);
    vec3 g = step(x0.yzx, x0.xyz);
    vec3 l = 1.0 - g;
    vec3 i1 = min(g.xyz, l.zxy);
    vec3 i2 = max(g.xyz, l.zxy);
    vec3 x1 = x0 - i1 + C.xxx;
    vec3 x2 = x0 - i2 + C.yyy;
    vec3 x3 = x0 - D.yyy;
    i = mod289(i);
    vec4 p = permute(permute(permute(
              i.z + vec4(0.0, i1.z, i2.z, 1.0))
            + i.y + vec4(0.0, i1.y, i2.y, 1.0))
            + i.x + vec4(0.0, i1.x, i2.x, 1.0));
    float n_ = 0.142857142857;
    vec3 ns = n_ * D.wyz - D.xzx;
    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
    vec4 x_ = floor(j * ns.z);
    vec4 y_ = floor(j - 7.0 * x_);
    vec4 x = x_ * ns.x + ns.yyyy;
    vec4 y = y_ * ns.x + ns.yyyy;
    vec4 h = 1.0 - abs(x) - abs(y);
    vec4 b0 = vec4(x.xy, y.xy);
    vec4 b1 = vec4(x.zw, y.zw);
    vec4 s0 = floor(b0) * 2.0 + 1.0;
    vec4 s1 = floor(b1) * 2.0 + 1.0;
    vec4 sh = -step(h, vec4(0.0));
    vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
    vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
    vec3 p0 = vec3(a0.xy, h.x);
    vec3 p1 = vec3(a0.zw, h.y);
    vec3 p2 = vec3(a1.xy, h.z);
    vec3 p3 = vec3(a1.zw, h.w);
    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
    vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
    m = m * m;
    return 105.0 * dot(m * m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
  }
`;

/* =========================================================================
   Sky : gradient shader with faint milky-way band
   ========================================================================= */
const skyGroup = new THREE.Group();
scene.add(skyGroup);

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(500, 48, 32),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: { uTime: { value: 0 } },
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main(){
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3 vDir;
      uniform float uTime;
      ${NOISE_GLSL}
      void main(){
        vec3 d = normalize(vDir);
        float h = clamp(d.y, -1.0, 1.0);

        // upper sky: deep navy at the zenith, slightly lighter above the horizon
        vec3 zenith  = vec3(0.0060, 0.0080, 0.0180);
        vec3 mid     = vec3(0.0180, 0.0290, 0.0560);
        vec3 horizon = vec3(0.0330, 0.0470, 0.0740);
        vec3 col = mix(horizon, mid, smoothstep(0.02, 0.30, h));
        col = mix(col, zenith, smoothstep(0.28, 0.95, h));

        // warm, faint glow far behind the tree
        float backGlow = smoothstep(0.30, 0.0, abs(h)) * smoothstep(-0.35, 0.25, d.z);
        col += vec3(0.050, 0.035, 0.026) * backGlow;

        // milky way band (soft, very subtle)
        vec3 bandN = normalize(vec3(0.60, 0.30, -0.74));
        float band = 1.0 - smoothstep(0.0, 0.30, abs(dot(d, bandN)));
        float n = snoise(d * 4.0 + vec3(0.0, 0.0, uTime * 0.008)) * 0.5 + 0.5;
        float n2 = snoise(d * 11.0 - vec3(uTime * 0.01)) * 0.5 + 0.5;
        col += vec3(0.026, 0.034, 0.070) * band * (0.25 + 0.75 * n * n2) * smoothstep(0.06, 0.45, h);

        // soft glow right above the horizon, and pure dark below it so the
        // seam with the ice plane never shows
        col += vec3(0.026, 0.038, 0.062) * exp(-pow(h / 0.05, 2.0));
        vec3 below = vec3(0.0180, 0.0230, 0.0330);
        col = mix(col, below, smoothstep(0.004, -0.02, h));

        gl_FragColor = vec4(col, 1.0);
      }
    `,
  })
);
skyGroup.add(sky);

/* =========================================================================
   Stars : soft point sprites
   ========================================================================= */
function makeStars(count) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const size = new Float32Array(count);
  const phase = new Float32Array(count);
  const palette = [
    new THREE.Color('#bfd4ff'),
    new THREE.Color('#ffffff'),
    new THREE.Color('#ffe9c4'),
    new THREE.Color('#9fd8ff'),
    new THREE.Color('#e6d6ff'),
  ];
  for (let i = 0; i < count; i++) {
    // upper hemisphere, denser near the top
    const u = rand();
    const theta = u * Math.PI * 2;
    const phi = Math.acos(Math.pow(rand(), 0.55)); // 0 = up
    const r = 460;
    const x = Math.sin(phi) * Math.cos(theta);
    const y = Math.cos(phi);
    const z = Math.sin(phi) * Math.sin(theta);
    pos[i * 3] = x * r;
    pos[i * 3 + 1] = Math.abs(y) * r * 0.95 + 8;
    pos[i * 3 + 2] = z * r;
    const c = pick(palette);
    const b = rr(0.35, 0.95) * (y > 0.86 ? 0.45 : 1.0) * (y < 0.12 ? 0.45 : 1.0);
    col[i * 3] = c.r * b; col[i * 3 + 1] = c.g * b; col[i * 3 + 2] = c.b * b;
    size[i] = rr(0.35, 1.6) * (rand() > 0.985 ? 2.0 : 1.0);
    phase[i] = rand();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    fog: false,
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
    vertexShader: /* glsl */`
      attribute vec3 aColor;
      attribute float aSize;
      attribute float aPhase;
      uniform float uTime;
      uniform float uPixelRatio;
      varying vec3 vColor;
      varying float vTwinkle;
      void main(){
        vColor = aColor;
        float tw = 0.62 + 0.38 * sin(uTime * (0.4 + aPhase * 1.5) + aPhase * 40.0);
        vTwinkle = tw;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uPixelRatio * 2.3 * (0.8 + 0.3 * tw);
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3 vColor;
      varying float vTwinkle;
      void main(){
        vec2 p = gl_PointCoord - 0.5;
        float d = length(p);
        if (d > 0.5) discard;
        float core = pow(smoothstep(0.5, 0.0, d), 2.4);
        float halo = smoothstep(0.5, 0.10, d) * 0.08;
        gl_FragColor = vec4(vColor * vTwinkle, core + halo * 0.7);
      }
    `,
  });
  const pts = new THREE.Points(g, mat);
  pts.frustumCulled = false;
  return pts;
}
const starPts = makeStars(P.stars);
skyGroup.add(starPts);

/* =========================================================================
   Lights
   ========================================================================= */
const ambient = new THREE.HemisphereLight(0x6f90c4, 0x0a1020, 0.5);
scene.add(ambient);
const moon = new THREE.DirectionalLight(0xbcd6ff, 0.55);
moon.position.set(-14, 26, 10);
scene.add(moon);
const fillWarm = new THREE.PointLight(0xff9d48, 13, 26, 2);
fillWarm.position.set(0, 5.0, 4.5);
scene.add(fillWarm);

/* =========================================================================
   Ice : procedural shader with fake vertical reflection
   ========================================================================= */
const ICE_BASE = new THREE.Color('#0d1524');
const iceMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uTreePos: { value: new THREE.Vector3(0, P.treeY, 0) },
    uAuroraA: { value: new THREE.Color('#22f0a4') },
    uAuroraB: { value: new THREE.Color('#4f7bff') },
    uAuroraC: { value: new THREE.Color('#9a6bff') },
    uIceBase: { value: ICE_BASE.clone() },
    uAuroraGlow: { value: 0.85 },
  },
  vertexShader: /* glsl */`
    varying vec2 vPos;
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vPos = wp.xz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime;
    uniform vec3 uTreePos;
    uniform vec3 uAuroraA;
    uniform vec3 uAuroraB;
    uniform vec3 uAuroraC;
    uniform vec3 uIceBase;
    uniform float uAuroraGlow;
    varying vec2 vPos;
    ${NOISE_GLSL}

    void main(){
      vec2 p = vPos;
      float r = length(p);

      // --- procedural sky above the tree, mirrored downward as "reflection" ---
      vec2 q = vec2(p.x * 0.075, -abs(p.y) * 0.028 + uTime * 0.004);
      float n = snoise(vec3(q, uTime * 0.012)) * 0.5 + 0.5;
      float n2 = snoise(vec3(q * 2.3 + 5.1, uTime * 0.02)) * 0.5 + 0.5;

      // aurora reflection: three soft vertical smears, teal / blue / violet
      float band1 = sin(p.x * 0.105 + n * 3.4 + uTime * 0.16);
      float band2 = sin(p.x * 0.048 - p.y * 0.06 + n2 * 2.6 - uTime * 0.10);
      float band3 = sin(p.x * 0.028 + p.y * 0.04 + n * 4.2 + uTime * 0.07);
      vec3 refl = uAuroraA * smoothstep(0.62, 1.0, band1) * 0.50
                + uAuroraB * smoothstep(0.68, 1.0, band2) * 0.34
                + uAuroraC * smoothstep(0.76, 1.0, band3) * 0.26;
      refl *= (0.30 + 0.85 * n2) * exp(-r * 0.045);

      // tree reflection: warm vertical smear under the trunk
      vec2 tp = p - uTreePos.xz;
      float treeCol = exp(-pow(tp.x / 2.6, 2.0)) * exp(-pow((abs(tp.y) - 2.2) / 6.0, 2.0));
      float flick = 0.82 + 0.18 * sin(uTime * 3.1 + p.y * 1.7);
      vec3 treeRefl = vec3(1.0, 0.60, 0.24) * treeCol * 0.34 * flick;

      // base ice colour with slow drifting sheen
      float sheen = (snoise(vec3(p * 0.09, uTime * 0.03)) * 0.5 + 0.5);
      vec3 col = uIceBase + vec3(0.006, 0.016, 0.032) * sheen;

      // sparkles on the ice surface
      float sp = snoise(vec3(p * 2.2, uTime * 0.22));
      float spark = smoothstep(0.88, 1.0, sp) * (0.5 + 0.5 * sin(uTime * 2.0 + p.x * 3.1 + p.y * 2.2));
      col += vec3(0.70, 0.84, 1.0) * spark * 0.28 * smoothstep(0.0, 8.0, r);

      col += refl * uAuroraGlow;
      col += treeRefl * smoothstep(4.0, 9.0, r);

      // far ice fades into a slightly lighter haze so it reads as distance, not a wall
      col = mix(col, vec3(0.0230, 0.0300, 0.0430), smoothstep(24.0, 140.0, r));
      // the horizon itself lifts a little brighter than the ice in front of it
      col += vec3(0.020, 0.026, 0.036) * smoothstep(110.0, 260.0, r);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const ice = new THREE.Mesh(new THREE.RingGeometry(0.0, 800, 128, 1), iceMat);
// RingGeometry lies in XY; rotate flat. Swap UV order so vPos uses world xz after rotation.
ice.rotation.x = -Math.PI / 2;
ice.frustumCulled = false;
scene.add(ice);
// the ring is triangulated in polar steps: give it enough radial resolution for the shader
{
  const g = new THREE.RingGeometry(0, 800, 128, 24);
  ice.geometry.dispose();
  ice.geometry = g;
}

/* =========================================================================
   Floating island (rock + snow cap) under the tree
   ========================================================================= */
const island = new THREE.Group();
scene.add(island);

// snow cap: a soft, slightly domed disc
const capMat = new THREE.MeshStandardMaterial({ color: 0xd7e4f8, roughness: 0.9, metalness: 0.0, emissive: 0x0c1c34, emissiveIntensity: 0.3 });
const capGeo = new THREE.CylinderGeometry(7.4, 7.1, 0.9, 72, 3, false);
{
  const pos = capGeo.attributes.position;

let fairyMat = null;
function spiralOnTree(yFrom, yTo, count, phase) {
  const pts = [];
  const turns = 5.4;

    const y = yFrom + (yTo - yFrom) * t;
    const a = t * Math.PI * 2 * turns + phase + Math.sin(t * 9.0) * 0.25;
    const r = TREE.radiusAt(y) * 0.97 + 0.06;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    pts.push(new THREE.Vector3(x, y - 0.22, z), new THREE.Vector3(x, y, z));
  }
  return pts;
}

  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const n = pts.length;
  const size = new Float32Array(n), phase = new Float32Array(n), warm = new Float32Array(n);

  g.setAttribute('aWarm', new THREE.BufferAttribute(warm, 1));
  fairyMat = new THREE.ShaderMaterial({

      attribute float aSize; attribute float aPhase; attribute float aWarm;

      void main(){
        float tw = 0.55 + 0.45 * sin(uTime * (1.4 + aPhase * 2.2) + aPhase * 62.8);
        vec3 warmC = vec3(1.0, 0.68, 0.30);

];

function makeAurora(def) {
  const geo = new THREE.CylinderGeometry(def.radius, def.radius, def.w, 240, 18, true);
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 },
      uPhase: { value: def.phase },
      uColorA: { value: new THREE.Color(def.c1) },
      uColorB: { value: new THREE.Color(def.c2) },
      uOpacity: { value: def.opacity },
      uAmp: { value: def.amp },
      uAngle: { value: 0 },
      uCamDist: { value: 30 },
    },
    vertexShader: /* glsl */`
      uniform float uTime;
      uniform float uPhase;
      uniform float uAmp;
      varying vec2 vUv;
      varying float vH;
      varying float vWave;
      ${NOISE_GLSL}
      void main(){
        vUv = uv;
        float a = uv.x * 6.2831853;
        float w1 = snoise(vec3(cos(a) * 0.9, sin(a) * 0.9, uTime * 0.06 + uPhase));
        float w2 = snoise(vec3(cos(a) * 2.1, sin(a) * 2.1, uTime * 0.10 + uPhase * 2.0));
        float rise = smoothstep(0.0, 1.0, uv.y);
        vec3 p = position;
        p.y += (w1 * 0.8 + w2 * 0.3) * uAmp * rise;
        p.y += sin(a * 3.0 + uTime * 0.25 + uPhase) * 0.25 * rise;
        vH = uv.y;
        vWave = w1 * 0.5 + 0.5;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime;
      uniform float uPhase;
      uniform vec3 uColorA;
      uniform vec3 uColorB;
      uniform float uOpacity;
      uniform float uAngle;
      uniform float uCamDist;
      varying vec2 vUv;
      varying float vH;
      varying float vWave;
      ${NOISE_GLSL}
      void main(){
        float a = vUv.x * 6.2831853;
        float h = vH;

        // don't lay a curtain between the camera and the tree:
        // fade the wall exactly where it faces the viewer
        float rel = mod(a - uAngle + 3.14159265, 6.2831853) - 3.14159265;
        float front = mix(0.35, 1.0, smoothstep(0.9, 2.4, abs(rel)));
        // also thin the curtain while it passes behind the tree from this angle
        float behind = smoothstep(1.9, 0.5, abs(rel));
        front *= 1.0 - 0.45 * behind;

        // vertical curtain rays, drifting sideways
        float r1 = snoise(vec3(a * 9.0 + uTime * 0.05, h * 1.6 - uTime * 0.12, uPhase)) * 0.5 + 0.5;
        float r2 = snoise(vec3(a * 26.0 - uTime * 0.08, h * 4.2 + uTime * 0.18, uPhase * 3.0)) * 0.5 + 0.5;
        float rays = mix(r1, r2, 0.4);
        rays = pow(rays, 1.6);

        // soft top / bottom edges
        float bottom = smoothstep(0.0, 0.42, h + vWave * 0.10);
        float top = 1.0 - smoothstep(0.62, 1.0, h);
        float shape = bottom * top;

        vec3 col = mix(uColorA, uColorB, smoothstep(0.02, 0.85, h));
        col += uColorB * pow(rays, 3.0) * 0.35;

        float alpha = shape * rays * uOpacity * front * 0.26;
        gl_FragColor = vec4(col * (0.55 + rays * 0.6), alpha);
      }
    `,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = def.y;
  mesh.rotation.z = def.tilt;
  mesh.rotation.y = def.phase;
  mesh.frustumCulled = false;
  return mesh;
}

});

   ========================================================================= */
const SNOW_BOX = { x: 64, y: 48, z: 64 };
const snowMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: {
    uTime: { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uMouse: { value: new THREE.Vector3(0, 12, -40) },
    uTree: { value: new THREE.Vector3(0, P.treeY + 5, 0) },
    uWind: { value: 0.5 },
    uBox: { value: new THREE.Vector3(SNOW_BOX.x, SNOW_BOX.y, SNOW_BOX.z) },
  },
  vertexShader: /* glsl */`
    attribute float aSize;
    attribute float aSpeed;
    attribute float aPhase;
    uniform float uTime;
    uniform float uPixelRatio;
    uniform vec3 uMouse;
    uniform vec3 uTree;
    uniform float uWind;
    uniform vec3 uBox;
    varying float vAlpha;
    varying float vColor;

    void main(){
      vec3 p = position;
      float t = uTime;

      p.y = mod(p.y - t * aSpeed, uBox.y) - uBox.y * 0.22;
      p.x += sin(t * (0.35 + aPhase * 0.5) + aPhase * 12.0) * (0.9 + aPhase);
      p.z += cos(t * (0.28 + aPhase * 0.4) + aPhase * 7.0) * (0.7 + aPhase * 0.8);
      p.x += sin(t * 0.11) * 2.2 * uWind;

      // bend gently towards the cursor
      vec3 toMouse = uMouse - p;
      float dm = length(toMouse);
      float infl = smoothstep(24.0, 0.0, dm) * 10.0 / (1.0 + dm * 0.55);
      p += normalize(toMouse + vec3(0.0001)) * infl * 0.5;

      // gentle repulsion so flakes hug the canopy
      vec3 toTree = p - uTree;
      float dT = length(toTree);
      float push = smoothstep(9.0, 3.0, dT);
      p += normalize(toTree + vec3(0.0001)) * push * 0.7;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;

      float dist = -mv.z;
      gl_PointSize = aSize * uPixelRatio * (95.0 / max(dist, 1.0));
      vAlpha = smoothstep(95.0, 30.0, dist) * smoothstep(1.0, 4.0, dist);
      vColor = step(0.86, fract(aPhase * 13.7));
    }
  `,
  fragmentShader: /* glsl */`
    varying float vAlpha;
    varying float vColor;
    void main(){
      vec2 p = gl_PointCoord - 0.5;
      float r = length(p);
      if (r > 0.5) discard;
      float a = smoothstep(0.5, 0.06, r);
      vec3 c = mix(vec3(0.92, 0.96, 1.0), vec3(1.0, 1.0, 1.0), vColor);
      gl_FragColor = vec4(c, a * vAlpha * 0.72);
    }
  `,
});
let snowPts;
{
  const n = P.snow;
  const pos = new Float32Array(n * 3);
  const size = new Float32Array(n);
  const speed = new Float32Array(n);
  const phase = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = rr(-SNOW_BOX.x / 2, SNOW_BOX.x / 2);
    pos[i * 3 + 1] = rr(0, SNOW_BOX.y);
    pos[i * 3 + 2] = rr(-SNOW_BOX.z / 2, SNOW_BOX.z / 2);
    size[i] = rr(0.30, 0.95) * (rand() > 0.96 ? 1.9 : 1);
    speed[i] = rr(0.55, 1.5);
    phase[i] = rand();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
  snowPts = new THREE.Points(g, snowMat);
  snowPts.frustumCulled = false;
  scene.add(snowPts);
}

/* =========================================================================
   Rising motes around the island (depth cue)
   ========================================================================= */
let motes;
{
  const n = P.motes;
  const pos = new Float32Array(n * 3);
  const ph = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const a = rand() * Math.PI * 2;
    const r = rr(9, 46);
    pos[i * 3] = Math.cos(a) * r;
    pos[i * 3 + 1] = rr(-14, 22);
    pos[i * 3 + 2] = Math.sin(a) * r;
    ph[i] = rand();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
    vertexShader: /* glsl */`
      attribute float aPhase; uniform float uTime; uniform float uPixelRatio; varying float vA;
      void main(){
        vec3 p = position;
        p.y += sin(uTime * 0.25 + aPhase * 30.0) * 1.2 + mod(uTime * (0.12 + aPhase * 0.18), 6.0);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = (1.2 + aPhase * 1.8) * uPixelRatio * (48.0 / max(-mv.z, 1.0));
        vA = (0.3 + 0.7 * abs(sin(uTime * 0.8 + aPhase * 20.0))) * smoothstep(70.0, 20.0, -mv.z);
      }
    `,
    fragmentShader: /* glsl */`
      varying float vA;
      void main(){
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vec3(0.58, 0.84, 1.0) * 0.9, a * a * vA * 0.3);
      }
    `,
  });
  motes = new THREE.Points(g, mat);
  motes.frustumCulled = false;
  scene.add(motes);
}

/* =========================================================================
   Orbiting gift lights around the tree
   ========================================================================= */
const orbitLights = [];
for (let i = 0; i < (isMobile ? 3 : 5); i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: new THREE.Color(1.0, 0.78, 0.46), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.8 }));
  s.scale.setScalar(rr(0.45, 0.8));
  scene.add(s);
  orbitLights.push({ sprite: s, radius: rr(6, 13), speed: rr(0.08, 0.18), phase: rr(0, Math.PI * 2), y: rr(2, 11), bob: rr(0.4, 1.4) });
}

/* =========================================================================
   Post-processing
   ========================================================================= */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR_CAP));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), P.bloom, 0.55, 0.78);
composer.addPass(bloom);
composer.addPass(new OutputPass());
composer.setSize(window.innerWidth, window.innerHeight);

// optional url overrides (handy for capture / debugging)
const params = new URLSearchParams(location.search);
if (params.has('bloom')) bloom.strength = parseFloat(params.get('bloom'));
if (params.has('exposure')) renderer.toneMappingExposure = parseFloat(params.get('exposure'));
const STATIC_FRAME = params.has('static');

/* =========================================================================
   Controls
   ========================================================================= */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.7;
controls.minDistance = 13;
controls.maxDistance = 52;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = Math.PI * 0.495;
controls.enablePan = false;
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 0.35;
controls.update();

/* =========================================================================
   Interaction
   ========================================================================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(9999, 9999);
const ndc = new THREE.Vector2();
let hasPointer = false;
let pointerDownAt = null;

function setPointerFromEvent(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  pointer.copy(ndc);
  hasPointer = true;
}
window.addEventListener('pointermove', setPointerFromEvent, { passive: true });
window.addEventListener('pointerdown', (e) => {
  setPointerFromEvent(e);
  pointerDownAt = { x: e.clientX, y: e.clientY, t: performance.now() };
});
window.addEventListener('pointerleave', () => { hasPointer = false; pointer.set(9999, 9999); });

/* ---- golden particle bursts ---- */
const BURST_MAX = 260;
const burstData = [];
const burstGeo = new THREE.BufferGeometry();
const bPos = new Float32Array(BURST_MAX * 3);
const bLife = new Float32Array(BURST_MAX);
const bSize = new Float32Array(BURST_MAX);
burstGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
burstGeo.setAttribute('aSize', new THREE.BufferAttribute(bSize, 1));
burstGeo.setAttribute('aLife', new THREE.BufferAttribute(bLife, 1));
const burstMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uPixelRatio: { value: renderer.getPixelRatio() } },
  vertexShader: /* glsl */`
    attribute float aSize; attribute float aLife;
    uniform float uPixelRatio; varying float vLife;
    void main(){
      vLife = aLife;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize * uPixelRatio * (1.0 + (1.0 - aLife) * 1.4) * (120.0 / max(-mv.z, 1.0));
    }
  `,
  fragmentShader: /* glsl */`
    varying float vLife;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.0, d);
      vec3 warm = mix(vec3(1.0, 0.52, 0.14), vec3(1.0, 0.92, 0.66), vLife);
      gl_FragColor = vec4(warm * (1.3 + vLife), a * a * vLife);
    }
  `,
});
const burstPoints = new THREE.Points(burstGeo, burstMat);
burstPoints.frustumCulled = false;
scene.add(burstPoints);
for (let i = 0; i < BURST_MAX; i++) burstData.push({ vx: 0, vy: 0, vz: 0, life: 0, active: false });
const burstLight = new THREE.PointLight(0xffc070, 0, 12, 2);
scene.add(burstLight);
let burstLightLife = 0;

function spawnBurst(worldPos, count = 70) {
  let spawned = 0;
  for (let i = 0; i < BURST_MAX && spawned < count; i++) {
    const d = burstData[i];
    if (d.active) continue;
    d.active = true;
    d.life = 1;
    const theta = rand() * Math.PI * 2;
    const phi = Math.acos(rr(-0.55, 1));
    const sp = rr(1.2, 4.4);
    d.vx = Math.sin(phi) * Math.cos(theta) * sp;
    d.vy = Math.cos(phi) * sp + rr(0.8, 2.0);
    d.vz = Math.sin(phi) * Math.sin(theta) * sp;
    const k = i * 3;
    bPos[k] = worldPos.x; bPos[k + 1] = worldPos.y; bPos[k + 2] = worldPos.z;
    bSize[i] = rr(0.55, 1.5);
    bLife[i] = 1;
    spawned++;
  }
  burstGeo.attributes.position.needsUpdate = true;
  burstGeo.attributes.aSize.needsUpdate = true;
  burstGeo.attributes.aLife.needsUpdate = true;
  burstLight.position.copy(worldPos);
  burstLight.intensity = 20;
  burstLightLife = 1;
  burstCount++;
}

let burstCount = 0;

function updateBursts(dt) {
  let any = false;
  for (let i = 0; i < BURST_MAX; i++) {
    const d = burstData[i];
    if (!d.active) { if (bLife[i] !== 0) { bLife[i] = 0; any = true; } continue; }
    any = true;
    d.life -= dt * 0.5;
    if (d.life <= 0) { d.active = false; d.life = 0; bLife[i] = 0; continue; }
    const k = i * 3;
    d.vy -= dt * 1.3;                       // light gravity
    const drag = Math.pow(0.92, dt * 60);
    d.vx *= drag; d.vy *= drag; d.vz *= drag;
    bPos[k] += d.vx * dt;
    bPos[k + 1] += d.vy * dt;
    bPos[k + 2] += d.vz * dt;
    bLife[i] = d.life;
  }
  if (any) {
    burstGeo.attributes.position.needsUpdate = true;
    burstGeo.attributes.aLife.needsUpdate = true;
  }
  if (burstLightLife > 0) {
    burstLightLife = Math.max(0, burstLightLife - dt * 1.6);
    burstLight.intensity = 20 * burstLightLife * burstLightLife;
  }
}

function handleClick(clientX, clientY) {
  const r = renderer.domElement.getBoundingClientRect();
  const x = (clientX - r.left) / r.width;
  const y = (clientY - r.top) / r.height;
  if (x < 0 || x > 1 || y < 0 || y > 1) return;
  ndc.x = x * 2 - 1;
  ndc.y = -(y * 2) + 1;
  raycaster.setFromCamera(ndc, camera);
  // picking a 0.2-0.3 unit bauble by sight is fiddly: aim with a generous sphere;
  // distant baubles get a proportionally wider aim so clicks stay easy on phones
  let best = null;
  let bestScore = Infinity;
  const world = new THREE.Vector3();
  const rayPoint = new THREE.Vector3();
  for (const o of ornaments) {
    o.getWorldPosition(world);
    raycaster.ray.closestPointToPoint(world, rayPoint);
    const score = rayPoint.distanceTo(world) / o.userData.ornament.size;
    if (score < 5.0 && score < bestScore) { bestScore = score; best = o; }
  }
  if (best) {
    const o = best.userData.ornament;
    o.flash = 1;
    best.getWorldPosition(world);
    spawnBurst(world, 70);
  }
}

window.addEventListener('pointerup', (e) => {
  if (!pointerDownAt) return;
  const dx = e.clientX - pointerDownAt.x;
  const dy = e.clientY - pointerDownAt.y;
  const moved = Math.hypot(dx, dy);
  const dt = performance.now() - pointerDownAt.t;
  pointerDownAt = null;
  if (moved < 10 && dt < 700) handleClick(e.clientX, e.clientY);
});

let parallaxX = 0;

/* ---- compass: a small dial showing where the camera is around the tree ---- */
const compassSize = 88;
const compassCanvas = document.createElement('canvas');
compassCanvas.width = compassCanvas.height = compassSize;
const compassTex = new THREE.CanvasTexture(compassCanvas);
compassTex.colorSpace = THREE.SRGBColorSpace;
const compassSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: compassTex, transparent: true, depthTest: false, depthWrite: false, opacity: 0, sizeAttenuation: false,
}));
compassSprite.scale.set(0.085, 0.085, 1);
compassSprite.position.set(0.9, -0.9, -1);
compassSprite.renderOrder = 10;
compassSprite.material.depthTest = false;
camera.add(compassSprite);
let compassOpacity = 0;
let compassOpacityTarget = 0.6;

function drawCompass(angle) {
  const ctx = compassCanvas.getContext('2d');
  const c = compassSize / 2;
  ctx.clearRect(0, 0, compassSize, compassSize);
  ctx.strokeStyle = 'rgba(190, 220, 255, 0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(c, c, 36, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const inner = i % 2 === 0 ? 28 : 31;
    ctx.strokeStyle = i % 2 === 0 ? 'rgba(200, 230, 255, 0.5)' : 'rgba(200, 230, 255, 0.25)';
    ctx.beginPath();
    ctx.moveTo(c + Math.sin(a) * inner, c + Math.cos(a) * inner);
    ctx.lineTo(c + Math.sin(a) * 36, c + Math.cos(a) * 36);
    ctx.stroke();
  }
  // aurora curtain marker (band 0 is the main ribbon)
  const ux = c + Math.sin(0.6) * 24, uy = c + Math.cos(0.6) * 24;
  ctx.fillStyle = 'rgba(90, 255, 200, 0.55)';
  ctx.beginPath(); ctx.arc(ux, uy, 3, 0, Math.PI * 2); ctx.fill();
  // tree marker
  ctx.fillStyle = 'rgba(255, 210, 150, 0.85)';
  ctx.beginPath(); ctx.arc(c, c, 3.2, 0, Math.PI * 2); ctx.fill();
  // the camera direction: a line from the centre out
  const dx = Math.sin(angle) * 36, dy = Math.cos(angle) * 36;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(c, c); ctx.lineTo(c + dx, c + dy); ctx.stroke();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
  ctx.beginPath(); ctx.arc(c + dx, c + dy, 3.4, 0, Math.PI * 2); ctx.fill();
  compassTex.needsUpdate = true;
}
function updateCompass() {
  if (compassOpacity < 0.05) return;
  if (compassFrame++ % 4 !== 0) return;
  const az = Math.atan2(camera.position.x, camera.position.z);
  drawCompass(az);
}
let compassFrame = 0;
drawCompass(Math.PI);
const mouseWorld = new THREE.Vector3();
const mousePlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

/* =========================================================================
   Resize
   ========================================================================= */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.fov = camera.aspect < 0.9 ? 74 : 52;
  camera.updateProjectionMatrix();
  // keep the corner compass clear of the title (bottom-left) and hint (bottom-right)
  const halfH = Math.min(camera.aspect * 0.95, 1) * 0.95;
  const inset = (h < 600 || camera.aspect < 0.9) ? 0.19 : 0.1;
  compassSprite.position.set(1 - inset, -halfH + inset * 0.9, -1);
  compassSprite.scale.setScalar((h < 600 || camera.aspect < 0.9) ? 0.12 : 0.085);
  const pr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(pr);
  composer.setSize(w, h);
  starPts.material.uniforms.uPixelRatio.value = pr;
  snowMat.uniforms.uPixelRatio.value = pr;
  motes.material.uniforms.uPixelRatio.value = pr;
  burstMat.uniforms.uPixelRatio.value = pr;
  if (fairyMat) fairyMat.uniforms.uPixelRatio.value = pr;
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
onResize();

/* =========================================================================
   Animation loop
   ========================================================================= */
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const t = elapsed;
  const speed = reduceMotion ? 0.3 : 1;

  // sky is pinned around the camera
  sky.position.copy(camera.position);
  starPts.material.uniforms.uTime.value = t;
  sky.material.uniforms.uTime.value = t;

  // aurora
  const camAngle = Math.atan2(camera.position.x, camera.position.z);
  const camDist = camera.position.length();
  for (let i = 0; i < auroras.length; i++) {
    const m = auroras[i];
    const u = m.material.uniforms;
    u.uTime.value = t;
    u.uAngle.value = camAngle;
    u.uCamDist.value = camDist;
    m.rotation.y = auroraBandDefs[i].phase + t * (0.018 + i * 0.006) * speed;
    m.rotation.z = auroraBandDefs[i].tilt + Math.sin(t * 0.05 + i) * 0.05;
  }
  auroraLightA.position.x = Math.cos(t * 0.12) * 13;
  auroraLightA.position.z = Math.sin(t * 0.12) * 13 - 4;
  auroraLightB.position.x = Math.cos(-t * 0.09 + 2) * 16;
  auroraLightB.position.z = Math.sin(-t * 0.09 + 2) * 16 - 6;
  auroraLightA.intensity = 26 + Math.sin(t * 0.6) * 7;
  auroraLightB.intensity = 18 + Math.sin(t * 0.45 + 1.7) * 5;

  // island float
  const bob = Math.sin(t * 0.45) * 0.16;
  island.position.y = bob;
  tree.position.y = P.treeY + bob;
  iceMat.uniforms.uTime.value = t;
  iceMat.uniforms.uTreePos.value.set(0, bob, 0);
  beamMat.uniforms.uTime.value = t;
  ringMat.opacity = 0.12 + Math.sin(t * 0.9) * 0.04;

  // tree
  if (fairyMat) fairyMat.uniforms.uTime.value = t;
  for (const L of treeLights) {
    L.intensity = L.userData.base * (0.72 + 0.28 * Math.sin(t * 1.3 + L.userData.phase));
  }
  fillWarm.intensity = 16 + Math.sin(t * 1.7) * 4;
  star.rotation.y = t * 0.5;
  starHalo.material.opacity = 0.45 + Math.sin(t * 2.2) * 0.08;
  starLight.intensity = 5 + Math.sin(t * 2.0) * 1.5;

  // ornaments (flash + settle)
  for (const o of ornaments) {
    const d = o.userData.ornament;
    if (d.flash > 0) {
      d.flash = Math.max(0, d.flash - dt * 1.35);
      const f = d.flash;
      o.material.emissive.copy(d.hot).lerp(d.base, 1 - Math.min(1, f * 1.6));
      o.material.emissiveIntensity = d.baseEmissive + Math.pow(f, 0.6) * 7.0;
      o.scale.setScalar(d.size * (1 + Math.sin(f * Math.PI) * 0.3));
    } else if (o.material.emissiveIntensity > d.baseEmissive + 0.001) {
      o.material.emissiveIntensity += (d.baseEmissive - o.material.emissiveIntensity) * Math.min(1, dt * 3);
      o.scale.setScalar(d.size);
    }
  }
  updateBursts(dt);

  // orbiting gift lights
  for (const o of orbitLights) {
    const a = t * o.speed * speed + o.phase;
    o.sprite.position.set(Math.cos(a) * o.radius, o.y + Math.sin(t * 0.6 + o.phase) * o.bob, Math.sin(a) * o.radius);
  }

  // snow
  snowMat.uniforms.uTime.value = t;
  snowMat.uniforms.uTree.value.set(0, P.treeY + 5 + bob, 0);
  snowMat.uniforms.uWind.value = 0.5 + Math.sin(t * 0.13) * 0.5;
  if (hasPointer) {
    raycaster.setFromCamera(pointer, camera);
    if (raycaster.ray.intersectPlane(mousePlane, mouseWorld)) {
      snowMat.uniforms.uMouse.value.lerp(mouseWorld, 0.08);
    }
  } else {
    snowMat.uniforms.uMouse.value.lerp(new THREE.Vector3(0, 26, -45), 0.02);
  }
  motes.material.uniforms.uTime.value = t;

  // subtle camera roll parallax toward the cursor
  const px = hasPointer ? pointer.x : 0;
  parallaxX += (px - parallaxX) * 0.03;
  const roll = reduceMotion ? 0 : parallaxX * 0.01;

  controls.autoRotate = !reduceMotion && !STATIC_FRAME;
  controls.update();
  compassOpacityTarget = pointerDownAt ? 0 : 1;
  compassOpacity += (compassOpacityTarget - compassOpacity) * 0.08;
  compassSprite.material.opacity = compassOpacity;
  // re-apply after update(): OrbitControls resets the roll each frame
  camera.rotation.z = roll;
  updateCompass();

  composer.render();
}

/* =========================================================================
   Boot
   ========================================================================= */
function reveal() {
  const loader = document.getElementById('loader');
  const hud = document.getElementById('hud');
  if (loader) loader.classList.add('is-hidden');
  if (hud) hud.classList.add('is-visible');
}
animate();
renderer.compile(scene, camera);
composer.render();
reveal();

// debug handle for manual checks
window.aurora = { scene, camera, renderer, ornaments, bloom, controls, spawnBurst, get burstCount() { return burstCount; } };
</script>
</body>
</html>
